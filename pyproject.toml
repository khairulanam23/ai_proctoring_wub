[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-proctoring"
version = "1.0.0"
description = "Computer-vision examination proctoring that produces evidence for a human proctor, not verdicts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["proctoring", "computer-vision", "examination", "moodle", "evidence"]

# Core: face presence, identity verification, temporal qualification, evidence
# packaging and the CLI. Behavioural analysis and object detection are extras, so
# a deployment that needs neither does not pull in mediapipe or torch.
dependencies = [
    "opencv-contrib-python>=4.8.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
behaviour = ["mediapipe>=0.10.0"]
detection = ["ultralytics>=8.3.0", "torch>=2.0.0", "torchvision>=0.15.0"]
plots = ["matplotlib>=3.7.0"]
all = ["ai-proctoring[behaviour,detection,plots]"]

[project.scripts]
proctor = "proctoring.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["proctoring*"]
exclude = ["scripts*", "data*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG"]
ignore = [
    "E501",    # line length is handled by the formatter, not the linter
    "B008",    # function calls in argument defaults are used deliberately for configs
    "SIM108",  # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
# Scripts bootstrap sys.path before importing the package, which E402 flags.
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["proctoring"]

[tool.mypy]
python_version = "3.10"
# The integration boundary and the event schema are what a host LMS depends on, so
# those are checked strictly. The detector wrappers deal in untyped third-party
# libraries and are checked loosely rather than drowned in ignores.
files = ["proctoring"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["proctoring.integration.*", "proctoring.core.*"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["proctoring.detection.*", "proctoring.analysis.*", "proctoring.capture.*"]
disallow_untyped_defs = false
