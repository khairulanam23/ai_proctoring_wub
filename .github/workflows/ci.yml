name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff mypy
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
        continue-on-error: true   # advisory until the detector wrappers are annotated

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install -e ".[behaviour,plots,dev]"
          pip install opencv-python-headless   # CI has no display

      # Model files are not committed. Tests that need them skip automatically,
      # but fetching them keeps CI covering the paths that matter most.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: proctoring-models-v1

      - name: Download models
        run: python scripts/download_models.py || echo "model download failed; dependent tests will skip"

      - name: Test
        run: pytest -q --cov=proctoring --cov-report=term-missing

      - name: Verify the package installs and imports cleanly
        run: |
          python -c "import proctoring; print(proctoring.__version__)"
          python -m proctoring.cli --help
