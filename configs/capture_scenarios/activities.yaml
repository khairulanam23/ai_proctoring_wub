# AI Proctoring Engine — Manual Still-Image Dataset Collection Activities Configuration
# Schema Version: 2.0.0-still
# Description: Serialized activity checklist for manual still-image dataset capture (2 photos per activity).

version: "2.0.0"
title: "AI Proctoring Still-Image Dataset Protocol"
photos_per_activity: 2

activities:
  # ============================================================================
  # CATEGORY A: Face & Normal Exam Posture (001 - 006)
  # ============================================================================
  - id: "ACT001"
    name: "Frontal screen reading"
    category: "FACE_POSTURE"
    instructed_condition: "frontal_screen_reading"
    physical_action: "Sit facing the laptop/monitor and look straight at the screen naturally."
    visible_state: "Face, shoulders, neutral frontal gaze, monitor glow."
    photo_1: "Eye-level shot matching typical webcam perspective."
    photo_2: "Slightly higher angle as from an elevated external webcam."
    purpose: "Positive baseline for frontal exam engagement and direct gaze."

  - id: "ACT002"
    name: "Downward gaze at keyboard"
    category: "FACE_POSTURE"
    instructed_condition: "downward_gaze_keyboard"
    physical_action: "Look down toward the keyboard or immediate desk area without dropping head excessively."
    visible_state: "Face with lowered eyelids, downward gaze direction, top of keyboard."
    photo_1: "Moderate downward eye tilt with head mostly upright."
    photo_2: "Head tilted forward approximately 20 degrees with downward gaze."
    purpose: "Negative example for off-screen gaze; positive baseline for natural downward typing/reading gaze."

  - id: "ACT003"
    name: "Off-screen gaze shift left"
    category: "FACE_POSTURE"
    instructed_condition: "offscreen_gaze_left"
    physical_action: "Shift gaze toward the left side of the room while keeping torso facing forward."
    visible_state: "Face with eyes redirected toward the left border of the frame."
    photo_1: "Eyes shifted left with head remaining mostly centered."
    photo_2: "Head and eyes both turned 30 degrees toward the left."
    purpose: "Positive example for off-screen gaze anomaly and head yaw rotation."

  - id: "ACT004"
    name: "Off-screen gaze shift right"
    category: "FACE_POSTURE"
    instructed_condition: "offscreen_gaze_right"
    physical_action: "Shift gaze toward the right side of the room while keeping torso facing forward."
    visible_state: "Face with eyes redirected toward the right border of the frame."
    photo_1: "Eyes shifted right with head remaining mostly centered."
    photo_2: "Head and eyes both turned 30 degrees toward the right."
    purpose: "Positive example for off-screen gaze anomaly and head yaw rotation."

  - id: "ACT005"
    name: "Posture shift - leaning back"
    category: "FACE_POSTURE"
    instructed_condition: "posture_leaning_back"
    physical_action: "Lean back comfortably into the chair, increasing distance from the camera."
    visible_state: "Full upper torso, face slightly farther away, desk surface foreground."
    photo_1: "Centered lean back directly away from the screen."
    photo_2: "Diagonal slouch toward one corner of the chair."
    purpose: "Robustness test for face bounding box scale and distance variation."

  - id: "ACT006"
    name: "Hand touching chin or cheek"
    category: "FACE_POSTURE"
    instructed_condition: "hand_touching_face"
    physical_action: "Rest one hand against the jaw, chin, or cheek in a natural thinking posture."
    visible_state: "Face with partial lower-face or jawline occlusion by the resting hand."
    photo_1: "Palm supporting the chin from below."
    photo_2: "Knuckles or side of index finger resting against the cheek."
    purpose: "Hard negative for facial phone occlusion; testing face detector robustness under hand contact."

  # ============================================================================
  # CATEGORY B: Hands & Neutral Desk States (007 - 010)
  # ============================================================================
  - id: "ACT007"
    name: "Empty hands resting on desk"
    category: "HANDS_DESK"
    instructed_condition: "empty_hands_desk"
    physical_action: "Place both hands flat or relaxed on the desk surface with no objects."
    visible_state: "Both open hands, wrists, keyboard, and surrounding clean desk space."
    photo_1: "Palms resting flat on the desk surface on either side of the keyboard."
    photo_2: "Relaxed open hands with fingers naturally curled."
    purpose: "Negative baseline for hand-held object presence."

  - id: "ACT008"
    name: "Active keyboard typing"
    category: "HANDS_DESK"
    instructed_condition: "active_typing"
    physical_action: "Position both hands over the keyboard with fingers poised on the keys."
    visible_state: "Both hands, all ten fingers, keyboard keys, and lower wrists."
    photo_1: "Symmetric typing position centered over the home row."
    photo_2: "One hand actively typing while the other rests on the trackpad/wrist rest."
    purpose: "Positive baseline for legitimate exam typing kinematics; negative for phone holding."

  - id: "ACT009"
    name: "Asymmetric single hand on desk"
    category: "HANDS_DESK"
    instructed_condition: "single_hand_desk"
    physical_action: "Keep one hand on the desk near keyboard while other hand rests out of view on lap."
    visible_state: "One clear empty hand on the desk, opposite side empty."
    photo_1: "Right hand on desk, left hand on lap."
    photo_2: "Left hand on desk, right hand on lap."
    purpose: "Negative example for secondary device presence when a hand leaves primary workspace."

  - id: "ACT010"
    name: "Clasped or interlaced fingers"
    category: "HANDS_DESK"
    instructed_condition: "clasped_fingers"
    physical_action: "Clasp both hands together with fingers interlaced, resting on the desk."
    visible_state: "Interlaced fingers, both wrists, desk foreground."
    photo_1: "Hands clasped flat on the desk."
    photo_2: "Hands clasped and slightly elevated 5 cm off the desk."
    purpose: "Hard negative for two-handed phone holding."

  # ============================================================================
  # CATEGORY C: Phone - Positive Cases (011 - 017)
  # ============================================================================
  - id: "ACT011"
    name: "Phone held in right hand at desk level"
    category: "PHONE_POSITIVE"
    instructed_condition: "phone_held_right_desk"
    physical_action: "Hold a smartphone in the right hand resting on or just above the desk."
    visible_state: "Phone screen, right hand fingers gripping the phone chassis, desk surface."
    photo_1: "Phone screen facing straight up toward ceiling."
    photo_2: "Phone tilted at a 45-degree angle toward candidate's eyes."
    purpose: "Positive example for handheld smartphone presence in primary hand."

  - id: "ACT012"
    name: "Phone held in left hand at desk level"
    category: "PHONE_POSITIVE"
    instructed_condition: "phone_held_left_desk"
    physical_action: "Hold a smartphone in the left hand resting on or just above the desk."
    visible_state: "Phone screen, left hand gripping the device, desk surface."
    photo_1: "Phone screen facing straight up toward ceiling."
    photo_2: "Phone tilted at a 45-degree angle toward candidate's eyes."
    purpose: "Positive example for handheld smartphone presence in non-dominant hand."

  - id: "ACT013"
    name: "Two-handed phone texting"
    category: "PHONE_POSITIVE"
    instructed_condition: "phone_two_handed_typing"
    physical_action: "Hold smartphone with both hands, using both thumbs over the screen."
    visible_state: "Both hands gripping phone edges, thumbs positioned on display glass."
    photo_1: "Phone held over the desk in front of the keyboard."
    photo_2: "Phone held closer to the candidate's chest/torso."
    purpose: "Positive example for bimanual mobile phone interaction."

  - id: "ACT014"
    name: "Phone lying flat on desk surface"
    category: "PHONE_POSITIVE"
    instructed_condition: "phone_flat_on_desk"
    physical_action: "Place the smartphone flat on the desk beside keyboard without hands touching it."
    visible_state: "Phone chassis, screen surface, keyboard edge, clean desk area."
    photo_1: "Phone screen facing up, located to right of keyboard."
    photo_2: "Phone placed face down (rear camera visible) near monitor base."
    purpose: "Positive example for unheld phone detection on desk workspace."

  - id: "ACT015"
    name: "Phone held below desk rim on lap"
    category: "PHONE_POSITIVE"
    instructed_condition: "phone_lap_level"
    physical_action: "Hold phone with one hand on your lap, partially hidden beneath front desk edge."
    visible_state: "Upper hand and top edge of phone visible just above or at the desk rim."
    photo_1: "Top one-third of phone visible above desk lip."
    photo_2: "Hand peeking over desk lip with only the corner of phone visible."
    purpose: "Challenging positive example for truncated and partially occluded phone usage."

  - id: "ACT016"
    name: "Phone raised toward screen level"
    category: "PHONE_POSITIVE"
    instructed_condition: "phone_raised_screen_level"
    physical_action: "Hold phone upright in front of monitor as if photographing the screen."
    visible_state: "Phone back or screen raised in upper half of frame near face level."
    photo_1: "Phone held with one hand at mid-chest level."
    photo_2: "Phone held at eye level partially occluding background."
    purpose: "Positive example for high-elevation screen capture attempt."

  - id: "ACT017"
    name: "Phone with heavy finger occlusion"
    category: "PHONE_POSITIVE"
    instructed_condition: "phone_heavy_occlusion"
    physical_action: "Hold phone with fingers spread across screen surface, covering logos and borders."
    visible_state: "Hand with only small portions of phone glass and chassis visible between fingers."
    photo_1: "Three fingers wrapped horizontally over front screen face."
    photo_2: "Palm covering half of back chassis and camera module."
    purpose: "Severe occlusion stress test for object boundary and feature detectors."

  # ============================================================================
  # CATEGORY D: Phone - Hard Negatives (018 - 023)
  # ============================================================================
  - id: "ACT018"
    name: "Empty cupped hand mimic"
    category: "PHONE_HARD_NEGATIVE"
    instructed_condition: "empty_cupped_hand"
    physical_action: "Shape one hand into curved grip as if holding a smartphone, but keep palm empty."
    visible_state: "Curled fingers and hollow palm resting on or near desk."
    photo_1: "Right hand curved in phone grip pose, viewed from front."
    photo_2: "Left hand curved in phone grip pose, viewed from side angle."
    purpose: "Critical hard negative for hand-pose-based false positive phone detections."

  - id: "ACT019"
    name: "Dark wallet in hand"
    category: "PHONE_HARD_NEGATIVE"
    instructed_condition: "wallet_in_hand"
    physical_action: "Hold a dark leather or fabric folding wallet in one hand on desk."
    visible_state: "Wallet edges, hand grip, desk surface."
    photo_1: "Closed rectangular wallet held flat in palm."
    photo_2: "Bifold wallet held tilted at angle resembling open phone folio case."
    purpose: "Critical hard negative discriminating dark rectangular wallets from smartphones."

  - id: "ACT020"
    name: "Handheld calculator in hand"
    category: "PHONE_HARD_NEGATIVE"
    instructed_condition: "calculator_in_hand"
    physical_action: "Hold a standard handheld calculator on desk with fingers touching keys."
    visible_state: "Rectangular plastic calculator, numeric keypad, LCD window, candidate's hand."
    photo_1: "Calculator held in one hand flat on desk."
    photo_2: "Calculator held angled with fingers pressing buttons."
    purpose: "Hard negative discriminating calculation tools from smartphones."

  - id: "ACT021"
    name: "TV or AC remote control in hand"
    category: "PHONE_HARD_NEGATIVE"
    instructed_condition: "remote_in_hand"
    physical_action: "Hold an elongated remote control on desk or raised slightly."
    visible_state: "Elongated dark rectangular body, rubber keypad, candidate's hand."
    photo_1: "Remote resting flat on desk held by fingertips."
    photo_2: "Remote pointed toward screen."
    purpose: "Hard negative for elongated handheld electronic devices."

  - id: "ACT022"
    name: "Rectangular power bank on desk"
    category: "PHONE_HARD_NEGATIVE"
    instructed_condition: "powerbank_on_desk"
    physical_action: "Place a rectangular matte power bank in hand or beside keyboard."
    visible_state: "Solid brick enclosure, USB ports, candidate's hand resting over it."
    photo_1: "Power bank held in hand like a smartphone."
    photo_2: "Power bank resting flat on desk adjacent to keyboard."
    purpose: "Hard negative for metal/plastic rectangular form factors matching phone dimensions."

  - id: "ACT023"
    name: "Eyeglass case held in hand"
    category: "PHONE_HARD_NEGATIVE"
    instructed_condition: "eyeglass_case_in_hand"
    physical_action: "Hold a closed clamshell eyeglass case in hand at desk height."
    visible_state: "Rounded rectangular case, hinge line, hand grip."
    photo_1: "Hardcase held horizontally in palm."
    photo_2: "Hardcase held vertically as if viewing a screen."
    purpose: "Hard negative for dark rounded rectangular personal accessories."

  # ============================================================================
  # CATEGORY E: Paper & Written Exam Materials - Positive Cases (024 - 028)
  # ============================================================================
  - id: "ACT024"
    name: "Single white paper sheet flat on desk"
    category: "PAPER_POSITIVE"
    instructed_condition: "paper_sheet_flat"
    physical_action: "Place an empty or printed single sheet of A4/letter paper flat on desk."
    visible_state: "Four clean straight paper boundaries, desk surface contrast, keyboard edge."
    photo_1: "Paper placed centered directly in front of candidate."
    photo_2: "Paper placed angled 30 degrees to right of keyboard."
    purpose: "Positive baseline for paper contour and quadrilateral detection."

  - id: "ACT025"
    name: "Active handwriting with pen on paper"
    category: "PAPER_POSITIVE"
    instructed_condition: "active_handwriting"
    physical_action: "Hold a pen and write on the paper sheet with hand resting on page."
    visible_state: "Pen barrel, writing hand posture, nib contacting paper, written lines."
    photo_1: "Writing position with pen clearly visible."
    photo_2: "Hand resting over written lines while pausing between words."
    purpose: "Positive example for writing kinematics and authorized paper examination work."

  - id: "ACT026"
    name: "Holding paper sheet up to read"
    category: "PAPER_POSITIVE"
    instructed_condition: "holding_paper_sheet"
    physical_action: "Lift paper sheet 10-15 cm off desk with one hand to read it."
    visible_state: "Lifted paper sheet exhibiting slight curve, hand holding page margin."
    photo_1: "Paper held upright facing candidate."
    photo_2: "Paper held at angle showing both front and back surfaces."
    purpose: "Positive example for non-coplanar, non-flat paper deformation."

  - id: "ACT027"
    name: "Multiple overlapping sheets and page flip"
    category: "PAPER_POSITIVE"
    instructed_condition: "paper_page_flip"
    physical_action: "Place two sheets on desk and use fingers to lift or turn top sheet."
    visible_state: "Two overlapping sheets, visible layer edge, hand performing page curl."
    photo_1: "Two staggered sheets with distinct overlapping boundaries."
    photo_2: "Top page curled upward at corner by fingertips."
    purpose: "Positive example for multi-page answer booklet handling."

  - id: "ACT028"
    name: "Forearm resting across paper sheet"
    category: "PAPER_POSITIVE"
    instructed_condition: "forearm_across_paper"
    physical_action: "Rest your forearm or wrist across middle of paper while thinking or writing."
    visible_state: "Forearm occluding 40-50% of paper surface, leaving corners visible."
    photo_1: "Forearm cutting horizontally across page."
    photo_2: "Palm and wrist resting heavily over top half of sheet."
    purpose: "Severe occlusion test for fragmented paper quadrilateral detection."

  # ============================================================================
  # CATEGORY F: Paper - Hard Negatives (029 - 032)
  # ============================================================================
  - id: "ACT029"
    name: "Bare white desk surface"
    category: "PAPER_HARD_NEGATIVE"
    instructed_condition: "bare_desk_surface"
    physical_action: "Clear desk completely, showing only plain light-colored or white desk top."
    visible_state: "Empty desk surface, keyboard, monitor stand, no paper present."
    photo_1: "Wide view of desk area in front of keyboard under normal lighting."
    photo_2: "Desk area with light glare or lamp reflection across surface."
    purpose: "Negative baseline preventing desk surface brightness from triggering paper false positives."

  - id: "ACT030"
    name: "Closed spiral or bound notebook"
    category: "PAPER_HARD_NEGATIVE"
    instructed_condition: "closed_notebook_desk"
    physical_action: "Place a closed bound notebook or spiral pad on desk."
    visible_state: "Thick notebook spine or wire binding, cover texture, dimensional edge."
    photo_1: "Closed notebook lying flat next to keyboard."
    photo_2: "Closed notebook with candidate's hand resting on cover."
    purpose: "Hard negative discriminating bound personal notebooks from loose exam sheets."

  - id: "ACT031"
    name: "Textbook on desk"
    category: "PAPER_HARD_NEGATIVE"
    instructed_condition: "textbook_on_desk"
    physical_action: "Place a standard thick textbook on desk surface."
    visible_state: "Bound book cover, printed graphics, page block thickness."
    photo_1: "Closed textbook lying flat on desk."
    photo_2: "Open textbook displaying two-page spread with dense typography."
    purpose: "Hard negative for unauthorized reference materials vs authorized exam sheets."

  - id: "ACT032"
    name: "White or silver laptop cover"
    category: "PAPER_HARD_NEGATIVE"
    instructed_condition: "closed_laptop_cover"
    physical_action: "Place a closed slim white or silver laptop/tablet flat on desk surface."
    visible_state: "Large flat rectangular light-colored surface, metallic/plastic sheen."
    photo_1: "Closed device lying beside active keyboard."
    photo_2: "Hand resting on top of closed device lid."
    purpose: "High-risk hard negative for large white rectangular contours mimicking paper."

  # ============================================================================
  # CATEGORY G: Ear / Earbud Positives (033 - 037)
  # ============================================================================
  - id: "ACT033"
    name: "Bare ear baseline"
    category: "EAR_POSITIVE"
    instructed_condition: "bare_ear_baseline"
    physical_action: "Turn head 35 degrees to expose one ear completely with no accessories or hair covering."
    visible_state: "Clear anatomical pinna, tragus, concha, and unobstructed ear canal."
    photo_1: "Left ear fully visible in profile."
    photo_2: "Right ear fully visible in profile."
    purpose: "Negative baseline for earbud detection; verifying unobstructed ear anatomy."

  - id: "ACT034"
    name: "Single wireless earbud in left ear"
    category: "EAR_POSITIVE"
    instructed_condition: "earbud_in_left_ear"
    physical_action: "Insert a wireless earbud securely into left ear."
    visible_state: "Earbud body seated in concha, earbud pod visible against ear anatomy."
    photo_1: "Direct side profile view of left ear showing earbud."
    photo_2: "Three-quarter view showing face and left earbud simultaneously."
    purpose: "Positive example for unilateral left earbud detection."

  - id: "ACT035"
    name: "Single wireless earbud in right ear"
    category: "EAR_POSITIVE"
    instructed_condition: "earbud_in_right_ear"
    physical_action: "Insert a wireless earbud securely into right ear."
    visible_state: "Earbud body seated in concha, earbud pod visible against ear anatomy."
    photo_1: "Direct side profile view of right ear showing earbud."
    photo_2: "Three-quarter view showing face and right earbud simultaneously."
    purpose: "Positive example for unilateral right earbud detection."

  - id: "ACT036"
    name: "Over-ear headphones on head"
    category: "EAR_POSITIVE"
    instructed_condition: "over_ear_headphones"
    physical_action: "Wear a standard pair of over-ear or on-ear headphones over both ears."
    visible_state: "Headband across top of head, large earcups completely covering both ears."
    photo_1: "Frontal view showing headband arch and both outer earcup borders."
    photo_2: "Side profile view showing earcup housing over ear."
    purpose: "Positive example for over-ear headphone detection."

  - id: "ACT037"
    name: "Wired in-ear earphones with cable"
    category: "EAR_POSITIVE"
    instructed_condition: "wired_earphones"
    physical_action: "Wear wired in-ear earphones with cable hanging down past neck and collar."
    visible_state: "Earbud in ear canal, thin wire descending along neck toward chest."
    photo_1: "Side view of ear showing earbud and descending wire."
    photo_2: "Frontal view showing wire draped over candidate's shoulder."
    purpose: "Positive example for wired earphone and cord detection."

  # ============================================================================
  # CATEGORY H: Ear / Earbud Hard Negatives (038 - 041)
  # ============================================================================
  - id: "ACT038"
    name: "Hand scratching or touching bare ear"
    category: "EAR_HARD_NEGATIVE"
    instructed_condition: "hand_touching_bare_ear"
    physical_action: "Raise one hand to touch, scratch, or cup bare ear with no earbud present."
    visible_state: "Fingers contacting or covering earlobe, pinna, or concha area."
    photo_1: "Index finger scratching earlobe with canal visible."
    photo_2: "Palm cupping ear in adjustment or listening gesture."
    purpose: "Critical hard negative discriminating flesh contact from earbuds or wearable devices."

  - id: "ACT039"
    name: "Hair partially covering ear"
    category: "EAR_HARD_NEGATIVE"
    instructed_condition: "hair_covering_ear"
    physical_action: "Let hair strands or bangs fall over upper and middle ear."
    visible_state: "Ear partially occluded by hair strands; no device present."
    photo_1: "Hair lightly draped across top half of ear."
    photo_2: "Hair tucked behind ear, creating shadow over concha."
    purpose: "Hard negative preventing hair shadows from triggering earbud detections."

  - id: "ACT040"
    name: "Eyeglasses temple arm over ear"
    category: "EAR_HARD_NEGATIVE"
    instructed_condition: "glasses_temple_over_ear"
    physical_action: "Wear eyeglasses with temple arm running horizontally above and behind ear."
    visible_state: "Glasses arm resting on ear cartilage; no earbud."
    photo_1: "Side profile showing glasses frame crossing upper ear."
    photo_2: "Hand adjusting glasses temple near ear."
    purpose: "Hard negative discriminating glasses frame hardware from earbud stems."

  - id: "ACT041"
    name: "Directional shadow across ear concha"
    category: "EAR_HARD_NEGATIVE"
    instructed_condition: "ear_concha_shadow"
    physical_action: "Angle lighting or turn head to create a deep anatomical shadow in ear cavity."
    visible_state: "High-contrast dark shadow inside concha/tragus; empty ear canal."
    photo_1: "Side lighting creating deep shadow in concha bowl."
    photo_2: "Overhead lighting casting upper pinna shadow downward into ear."
    purpose: "Hard negative testing robustness against dark shadow false positives in ear canal."

  # ============================================================================
  # CATEGORY I: Framing, Boundary & Multi-Subject Cases (042 - 045)
  # ============================================================================
  - id: "ACT042"
    name: "Phone at extreme lower frame boundary"
    category: "BOUNDARY_FRAMING"
    instructed_condition: "phone_boundary_lower"
    physical_action: "Hold phone so only top 20% of device crosses into bottom edge of frame."
    visible_state: "Top edge of phone or camera lens barely peeking into frame."
    photo_1: "Phone peeking through bottom center edge of photograph."
    photo_2: "Phone peeking through bottom right corner of photograph."
    purpose: "Boundary truncation test for partial object classification at camera FOV limits."

  - id: "ACT043"
    name: "Paper at extreme side frame boundary"
    category: "BOUNDARY_FRAMING"
    instructed_condition: "paper_boundary_side"
    physical_action: "Place paper sheet so more than half of page extends outside side camera border."
    visible_state: "Two corners and partial edges of paper cut off by image border."
    photo_1: "Paper cut off by left image boundary."
    photo_2: "Paper cut off by right image boundary."
    purpose: "Boundary truncation test for incomplete paper quadrilateral estimation."

  - id: "ACT044"
    name: "Secondary person in background"
    category: "BOUNDARY_FRAMING"
    instructed_condition: "second_person_background"
    physical_action: "Have a second person briefly walk, stand, or sit in background behind candidate."
    visible_state: "Candidate in sharp foreground; second face/body partially visible in background."
    photo_1: "Second face clearly visible over candidate's shoulder."
    photo_2: "Second person's torso/arm visible passing behind candidate's chair."
    purpose: "Test for multi-person detection and candidate-vs-bystander association."

  - id: "ACT045"
    name: "Candidate partially cropped at frame margin"
    category: "BOUNDARY_FRAMING"
    instructed_condition: "candidate_cropped_margin"
    physical_action: "Shift sitting position so half of face and one shoulder are cut off by frame edge."
    visible_state: "Half-face, single eye, one hand, desk area; opposite side empty."
    photo_1: "Candidate shifted to extreme left border of frame."
    photo_2: "Candidate shifted to extreme right border of frame."
    purpose: "Boundary test for facial landmarking and head pose tracking under severe image truncation."
